
name: Build Android TV APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Nom de l'application"
        required: true
        default: "Anime Sama"
      website_url:
        description: "Adresse HTTPS du site"
        required: true
        default: "https://example.com"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create Android project
        env:
          APP_NAME: ${{ inputs.app_name }}
          WEBSITE_URL: ${{ inputs.website_url }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import json
          import xml.sax.saxutils as xml
          from urllib.parse import urlparse

          name = os.environ["APP_NAME"].strip()
          url = os.environ["WEBSITE_URL"].strip()
          parsed = urlparse(url)

          if not name or len(name) > 60:
              raise SystemExit("Invalid application name")
          if parsed.scheme != "https" or not parsed.netloc:
              raise SystemExit("A valid HTTPS URL is required")

          def write(path, content):
              file = pathlib.Path(path)
              file.parent.mkdir(parents=True, exist_ok=True)
              file.write_text(content, encoding="utf-8")

          write("settings.gradle", """
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'TVAppBuilder'
          include ':app'
          """)

          write("build.gradle", """
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          """)

          write("app/build.gradle", """
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.tvappbuilder.launcher'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.tvappbuilder.launcher'
                  minSdk 23
                  targetSdk 28
                  versionCode 1
                  versionName '1.0'
              }
          }
          """)

          label = xml.escape(name, {'"': '&quot;'})

          write("app/src/main/AndroidManifest.xml", f"""
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="{label}"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          """)

          url_literal = json.dumps(url)

          write("app/src/main/java/com/tvappbuilder/launcher/MainActivity.java", f"""
          package com.tvappbuilder.launcher;

          import android.app.Activity;
          import android.os.Bundle;
          import android.content.Intent;
          import android.net.Uri;

          public class MainActivity extends Activity {{
              @Override
              public void onCreate(Bundle savedInstanceState) {{
                  super.onCreate(savedInstanceState);
                  Intent intent = new Intent(
                      Intent.ACTION_VIEW,
                      Uri.parse({url_literal})
                  );
                  intent.setPackage("com.phlox.tvwebbrowser");
                  try {{
                      startActivity(intent);
                  }} catch (Exception e) {{
                      intent.setPackage(null);
                      try {{
                          startActivity(intent);
                      }} catch (Exception ignored) {{}}
                  }}
                  finish();
              }}
          }}
          """)
          PY

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-tv-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
