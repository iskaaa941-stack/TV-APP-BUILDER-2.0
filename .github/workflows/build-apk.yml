name: Build Android TV APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Nom de l'application"
        required: true
        default: "Anime Sama"
      website_url:
        description: "Adresse du site HTTPS"
        required: true
        default: "https://example.com"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

        - name: Install Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create Android project
        env:
          APP_NAME: ${{ inputs.app_name }}
          WEBSITE_URL: ${{ inputs.website_url }}
        run: |
          python3 - <<'PY'
          import os, pathlib, json
          from urllib.parse import urlparse
          name = os.environ["APP_NAME"].strip()
          url = os.environ["WEBSITE_URL"].strip()
          if not name or len(name) > 60:
              raise SystemExit("Invalid app name")
          p = urlparse(url)
          if p.scheme != "https" or not p.netloc:
              raise SystemExit("A valid HTTPS URL is required")
          def write(path, content):
              path = pathlib.Path(path)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content, encoding="utf-8")
          write("settings.gradle", "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }\ndependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }\nrootProject.name = 'TVAppBuilder'\ninclude ':app'\n")
          write("build.gradle", "plugins { id 'com.android.application' version '8.5.2' apply false }\n")
          write("app/build.gradle", "plugins { id 'com.android.application' }\nandroid { namespace 'com.tvappbuilder.launcher'; compileSdk 35; defaultConfig { applicationId 'com.tvappbuilder.launcher'; minSdk 23; targetSdk 28; versionCode 1; versionName '1.0' } }\n")
          import xml.sax.saxutils as xml
          label = xml.escape(name, {'"': '&quot;'})
          write("app/src/main/AndroidManifest.xml", f'''<manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="{label}" android:theme="@android:style/Theme.Material.NoActionBar" android:usesCleartextTraffic="false"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LEANBACK_LAUNCHER"/></intent-filter></activity></application></manifest>''')
          url_literal = json.dumps(url, ensure_ascii=True)
          write("app/src/main/java/com/tvappbuilder/launcher/MainActivity.java", f'''package com.tvappbuilder.launcher;
          import android.app.Activity;
          import android.os.Bundle;
          import android.content.Intent;
          import android.net.Uri;
          public class MainActivity extends Activity {{
            @Override public void onCreate(Bundle b) {{
              super.onCreate(b);
              Intent i = new Intent(Intent.ACTION_VIEW, Uri.parse({url_literal}));
              i.setPackage("com.phlox.tvwebbrowser");
              try {{ startActivity(i); }}
              catch (Exception e) {{
                i.setPackage(null);
                try {{ startActivity(i); }} catch (Exception ignored) {{ }}
              }}
              finish();
            }}
          }}''')
          PY

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-tv-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
